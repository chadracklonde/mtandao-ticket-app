name: Compiler et tester

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyse et tests
        run: |
          mkdir -p /tmp/logs
          flutter --version 2>&1 | tee /tmp/logs/00-version.txt
          flutter pub get 2>&1 | tee /tmp/logs/01-pub-get.txt
          flutter analyze 2>&1 | tee /tmp/logs/03-analyze.txt || true
          flutter test 2>&1 | tee /tmp/logs/04-test.txt
          exit ${PIPESTATUS[0]}
      - name: Publier les journaux (branche ci-logs)
        if: always()
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub && cp /tmp/logs/* /tmp/pub/ && cd /tmp/pub
          echo "$GITHUB_SHA" > commit.txt
          git config --global user.name 'ci'
          git config --global user.email 'ci@users.noreply.github.com'
          git init -q && git checkout -q -b ci-logs && git add -A
          git commit -q -m "journaux du $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs

  apk:
    # APK : à la demande, ou quand le message du commit contient [apk]
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Compiler l'APK
        run: |
          mkdir -p /tmp/logs
          flutter create --org cd.xsoftdesign --project-name mtandao_ticket --platforms android .
          rm -f test/widget_test.dart
          f=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$f" || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$f"
          sed -i 's|android:label="mtandao_ticket"|android:label="Mtandao Ticket"|' "$f"
          for p in FOREGROUND_SERVICE FOREGROUND_SERVICE_DATA_SYNC POST_NOTIFICATIONS WAKE_LOCK; do
            grep -q "android.permission.$p\"" "$f" || sed -i "s|<application|<uses-permission android:name=\"android.permission.$p\"/>\n    <application|" "$f"
          done
          sed -i 's|</application>|    <meta-data android:name="cd.xsoftdesign.mtandao_ticket.NOTIFICATION_ICON" android:resource="@drawable/ic_stat_wifi"/>\n    </application>|' "$f"
          mkdir -p android/app/src/main/res/drawable
          cp android_extras/ic_stat_wifi.xml android/app/src/main/res/drawable/ic_stat_wifi.xml
          grep -n 'android:label' "$f"
          flutter pub get
          rm -f flutter_launcher_icons-windows.yaml flutter_launcher_icons-macos.yaml
          dart run flutter_launcher_icons 2>&1 | tee /tmp/logs/02-icons.txt
          grep -q "Successfully" /tmp/logs/02-icons.txt && ls android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          flutter build apk --release 2>&1 | tee /tmp/logs/05-apk.txt
          exit ${PIPESTATUS[0]}
      - name: Nommer l'APK
        run: cp build/app/outputs/flutter-apk/app-release.apk mtandao-ticket-test.apk
      - name: Signer l'APK avec la clé de publication (si les secrets existent)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Pas de clé de publication : APK signé avec la clé de test."; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD mtandao-ticket-test.apk
          "$bt/apksigner" verify --print-certs mtandao-ticket-test.apk | grep -i "SHA-256"
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: mtandao-ticket-apk
          path: mtandao-ticket-test.apk
      - name: Publier l'APK (page Releases, téléchargeable depuis le téléphone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Version de test ${{ github.run_number }}
          prerelease: true
          body: "APK de test de Mtandao Ticket (signé avec une clé de test). Installer sur Android en autorisant les sources inconnues."
          files: mtandao-ticket-test.apk
      - name: Publier les journaux (branche ci-logs-apk)
        if: always()
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub && cp /tmp/logs/* /tmp/pub/ && cd /tmp/pub
          git config --global user.name 'ci'
          git config --global user.email 'ci@users.noreply.github.com'
          git init -q && git checkout -q -b ci-logs-apk && git add -A
          git commit -q -m "journaux apk du $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs-apk

  windows:
    # Windows : quand le message du commit contient [desktop]
    if: contains(github.event.head_commit.message, '[desktop]')
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Compiler pour Windows
        run: |
          mkdir -p /tmp/logs
          flutter config --enable-windows-desktop
          flutter create --org cd.xsoftdesign --project-name mtandao_ticket --platforms windows .
          rm -f test/widget_test.dart
          sed -i 's|L"mtandao_ticket"|L"Mtandao Ticket"|' windows/runner/main.cpp
          flutter pub get
          dart run flutter_launcher_icons -f flutter_launcher_icons-windows.yaml 2>&1 | tee /tmp/logs/02-icons.txt
          flutter build windows --release 2>&1 | tee /tmp/logs/05-windows.txt
          exit ${PIPESTATUS[0]}
      - name: Archive Windows
        run: |
          mkdir -p dist/MtandaoTicket
          cp -r build/windows/x64/runner/Release/* dist/MtandaoTicket/
          cd dist && powershell -Command "Compress-Archive -Path MtandaoTicket -DestinationPath ../mtandao-ticket-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mtandao-ticket-windows
          path: mtandao-ticket-windows.zip
      - name: Publier (page Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Version de test ${{ github.run_number }}
          prerelease: true
          files: mtandao-ticket-windows.zip
      - name: Publier les journaux (branche ci-logs-windows)
        if: always()
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub && cp /tmp/logs/* /tmp/pub/ && cd /tmp/pub
          git config --global user.name 'ci'
          git config --global user.email 'ci@users.noreply.github.com'
          git init -q && git checkout -q -b ci-logs-windows && git add -A
          git commit -q -m "journaux windows du $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs-windows

  macos:
    # macOS : quand le message du commit contient [desktop] (après Windows, pour ne pas créer la page Releases en double)
    if: ${{ !cancelled() && contains(github.event.head_commit.message, '[desktop]') && needs.test.result == 'success' }}
    needs: [test, windows]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Compiler pour macOS
        run: |
          mkdir -p /tmp/logs
          flutter config --enable-macos-desktop
          flutter create --org cd.xsoftdesign --project-name mtandao_ticket --platforms macos .
          rm -f test/widget_test.dart
          # Application distribuée hors App Store : pas de bac à sable (accès réseau et dossier Documents)
          for f in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            /usr/libexec/PlistBuddy -c "Set :com.apple.security.app-sandbox false" "$f"
          done
          sed -i '' 's|PRODUCT_NAME = mtandao_ticket|PRODUCT_NAME = Mtandao Ticket|' macos/Runner/Configs/AppInfo.xcconfig
          flutter pub get
          dart run flutter_launcher_icons -f flutter_launcher_icons-macos.yaml 2>&1 | tee /tmp/logs/02-icons.txt
          flutter build macos --release 2>&1 | tee /tmp/logs/05-macos.txt
          exit ${PIPESTATUS[0]}
      - name: Archive macOS
        run: |
          app=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          echo "application : $app"
          ditto -c -k --sequesterRsrc --keepParent "$app" mtandao-ticket-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mtandao-ticket-macos
          path: mtandao-ticket-macos.zip
      - name: Publier (page Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Version de test ${{ github.run_number }}
          prerelease: true
          files: mtandao-ticket-macos.zip
      - name: Publier les journaux (branche ci-logs-macos)
        if: always()
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub && cp /tmp/logs/* /tmp/pub/ && cd /tmp/pub
          git config --global user.name 'ci'
          git config --global user.email 'ci@users.noreply.github.com'
          git init -q && git checkout -q -b ci-logs-macos && git add -A
          git commit -q -m "journaux macos du $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs-macos
