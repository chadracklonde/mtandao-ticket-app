name: mtandao_ticket
description: Gestion d'un hotspot MikroTik (façon Mikhmon) depuis un téléphone Android.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  pdf: ^3.11.1
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/icon_square.png
  adaptive_icon_background: "#0F5FD0"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
