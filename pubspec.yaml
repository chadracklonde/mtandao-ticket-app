name: mtandao_ticket
description: Gestion d'un hotspot MikroTik (façon Mikhmon) depuis un téléphone Android.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.3
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  pdf: ^3.11.1
  printing: ^5.13.1
  excel: ^4.0.6
  share_plus: ^10.1.4
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/icon_square.png
  adaptive_icon_background: "#D7263D"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
